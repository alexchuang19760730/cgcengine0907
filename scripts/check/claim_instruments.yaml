# 引用的量具登記表（claim → instrument registry）
#
# 用途：`scripts/check/claim_instrument_check.py` 讀這張表，對每個「被引用的數字」機械驗證三件事：
#   ① **量具在量測當日已經可以武裝**（開關首次進 `run_server.sh` 白名單的日期 <= 量測日）
#   ② **量具今天還活著**（原始碼符號在？開關還在白名單？字串還在建置產物裡？工具在？產物在磁碟上？）
#   ③ **入口與口徑是不是 operator 認可的那一組**
#
# 這張表的存在理由是本 session 抓到的同一族病（已知 7 次）：**數字比量具新**——
# 一個數字被引用時，它的量具可能當時不存在、當時不可武裝、或今天已經死了。
# 這張表讓那件事變成一個布林，而不是靠讀文件讀出來。
#
# 填表紀律
#   * `measured_on`：**量測當日**（不是文件日）。沒有可靠日期就寫 `unknown`（會被標 WARN，不會被猜）。
#   * `entry`：數字是用哪個入口產生的。`harness bench` = `harness_bench`（認可）；
#     `llama-bench` / `llama_bench_matrix.py` 直跑 = `llama_bench_matrix`（**繞過 launcher 的白名單**）。
#     查不到就寫 `unknown`——**WARN 比假裝知道好**。
#   * `caliber`：profile（`prod-new` = 認可）。舊口徑（`prod25` 等）會被標 VOID-WRONG-CALIBER。
#   * `requires`：這個數字**必須**靠哪些 env 開關才可能被產生。少了任何一個 ⇒ 那次的數字不可能來自那個入口。
#   * `caveat`：**機械檢查不到、但引用時必須一起寫**的話。這裡是「人記得、機器不記得」的那一半。

# operator 2026-09-28 立的規則：只用 prod-new profile ＋ harness bench 的產物。
