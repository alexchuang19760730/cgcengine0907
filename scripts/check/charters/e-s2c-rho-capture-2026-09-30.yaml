# ── 【補丁與驗收（2026-09-30 交付：**不套用**、可即刻 `git apply`）】───────────────
delivery:
  patch: "Backup/s2c_2026-09-30/s2c_rho_capture.patch（md5 104e6d903868472b13687b64e504d65b、5948 B；targets `src/llama.cpp/src/llama-context.cpp`；2 hunks：:3566 前置宣告 ＋ :4269 投遞區塊）"
  base: "src/llama.cpp/src/llama-context.cpp @ md5 bc65fbb4c8e1f5f2c8c1d97c282334bd（10287 行）——補丁是對這份內容產生的；別人若先改同一檔，用 `git apply --3way` 再重跑下面的檢查"
  evidence: "Backup/s2c_2026-09-30/delivery.json（逐項結果與指令）"
  verified:
    - "`git apply --check -p1 …` 對**未修改的實檔** ⇒ PASS（不是只對 scratch 樹放行）"
    - "`patch -p1` 進 scratch 樹後與我打算交付的內容 `cmp` 位元相同 ⇒ 補丁重現得了它宣稱的東西"
    - "`-fsyntax-only`（直接取專案 build 的 compile_commands 那一條）⇒ rc=0、0 error、**兩個 hunk 內 0 warning**（其餘 7 條 warning 在別處、已存在：595／627／5821／6687／6691／6754／6759）"
  instrument: |
    `instrument_binding.PROBES` 新增 `rho_s2c`（`CGC-RHO-S2C: steps=\\d+ layers=(\\d+)`，值取累計 `layers=`）、
    `PROBE_REQUIRES['rho_s2c'] = [CGC_RHO_PROBE, CGC_SEG_BATCH]`。`--self-test` ALL PASS；
    `static_precheck` 兩個方向都拒跑過（只給 SEG_BATCH ⇒ 拒；只給 PROBE ⇒ 拒；兩個都在 ⇒ 放行）。
    為什麼需要它：`rho_capture` 綁的是 `CGC-RHO-SUM`，而那一行印在**被跳過的 hook** 裡（:6844）⇒ 少了它，
    事後分不開「沒送達」與「送達但沒記帳」，而 S2-b 的單段臂正好就是前者。
  apply_and_run: |
    1) git apply --3way Backup/s2c_2026-09-30/s2c_rho_capture.patch        # 在擁有 src/ 的那棵樹
    2) cmake --build src/llama.cpp/build --target llama-server llama-bench -j 8
    3) 對照臂（可重用既有錨）：
       python3 scripts/check/m123_oracle_gate.py --profile prefill250 --tag r6ctl-nosegbatch-2026-09-30
    4) 見證臂：
       python3 scripts/check/m123_oracle_gate.py --profile prefill250 --tag r6-segbatch-<日期> \
           --env CGC_SEG_BATCH=1 --env CGC_SLOT_TABLE_GPU=1 --env CGC_RHO_PROBE=1 \
           --env CGC_RHO_FILL=1 --env CGC_SERVER_NO_PREFETCH=0
    5) 判詞（配對見證）：
       python3 scripts/check/r6_witness.py \
           --control Backup/m123_oracle_gate/summary_r6ctl-nosegbatch-2026-09-30.json \
           --arm     Backup/m123_oracle_gate/summary_r6-segbatch-<日期>.json      # 期望 WITNESS_GREEN
    6) 見證行（跑前／跑後都可用）：
       grep -c 'CGC-RHO-S2C:' <arm stderr>        # ≥ 1，且 layers/step == 主幹層數（本 cell 40）
       python3 scripts/check/instrument_binding.py --log <arm stderr> \
           --arm-env "CGC_SEG_BATCH=1;CGC_RHO_PROBE=1;CGC_RHO_FILL=1" --require rho_s2c   # 期望 BOUND
  caveat_r5: |
    這支臂帶 `CGC_RHO_PROBE`（`quote_gate` 的 THROUGHPUT_VOID_INSTRUMENTS）⇒ **即使 R6 解除，它的 t/s 仍不可引用**；
    本卡端點是位元（M1）與計數器，不受影響。R5 要解除得先有 L20-7 的價格 ≤ 視窗，而 2026-09-30 的兩趟反序
    判 **REFUSE**（docs/S3B_RHO_COST_2026-09-30.md §7.6）⇒ 本卡能主張的只有「R6 解除」，**不是**「20+ 可引用」。
    同一輪還量到 on 臂的輪級重尾（3/4 趟 vs off 0/4、Fisher p=0.071），判別器是 A/A 空對照 ⇒ 若重尾屬 ρ 的
    每層同步讀回，交付的形狀要改成**每步一次**讀回再談把它當機制引用。
  fork_if_falsified: |
    M1 ≤ 2/9 **且**見證行存在 ⇒ 先試同一區塊裡的**免費第二槓桿**：那一步的 routed ids 已經在 `ibuf` 裡
    （且已經餵進 `cache_step_union`）⇒ 直接用它對下一步的 union 發 fill（完美預測、不新增讀回、
    不帶 R5 旋鈕）。它也不動 M1 才轉 §4.2（prev-token 預測 ＋ 逐層重算，走 D5 引擎手術立項）。

