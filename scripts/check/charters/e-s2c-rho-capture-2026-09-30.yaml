# ═══════════════════════════════════════════════════════════════════════
# 實驗立項卡（Charter）—— S2-c：把 ρ capture 搬出被跳過的 per-layer hook，接到單段路徑
#                          已有的讀回通道（補「投遞通路」），驗收 M1 回到 9/9
# ═══════════════════════════════════════════════════════════════════════
# 為什麼要立這一張（S2-b 的判決，docs/S2_S3_2026-09-30.md）：
#   ① S2-b 把 prefetch 真的打開後，**誠實臂**的 ρ 有效（hit 89.2% → 96.3%、evictions 686 → 163），
#      而**單段臂逐項不變**（5976 req／97.4%／miss 153 全 compulsory／evictions 41）。
#   ② 靜態根因不是「猜不中」，是**投遞通路被單段提交自己關掉**：
#      `cgc_rho_capture()`（llama-context.cpp:4664）只在 `expert_cache_eval_cb`（:4798 → :4837）
#      裡被呼叫，而那正是 `CGC_SEG_BATCH=1` **跳過**的 per-layer hook（:4103 的註解明寫
#      "SKIPS THE HOOK"）⇒ `g_rho_logits` 始終為空 ⇒ `cgc_rho_prefetch()`（:4708）
#      在 :4727 的 `empty()` 守衛直接 return。
#   ③ 反證：單段臂的 hit（97.4%）比誠實臂（89.2%）還高 ⇒ 原假說「單段臂因跳 hook 掉駐留」
#      不成立，「把池子填滿」也不是槓桿（全部 miss 都是 compulsory、capacity=0、
#      layers_distinct_over_slots=0）⇒ 剩下的唯一未測分支就是**這條通路本身**。
# 全文與兩條路的優先序：docs/R6_SEGBATCH_FIX_PLAN_2026-09-30.md（§四）。
id: e-s2c-rho-capture
owner: freebuff（S 線 / S2）
created: '2026-09-30'
axis: S

# ── 【目標】── 一個可判定的問題，且**兩個答案都有意義**（不是「試試看」）────────
question: |
  把 ρ capture 從被單段提交跳過的 per-layer hook 搬出、接到單段路徑**已經有**的讀回通道
  （比照 P1 的 `cgc_rb_seg_batch && (...)`，llama-context.cpp:4122）之後，單段臂
  （`CGC_SEG_BATCH=1`）的 M1 能不能回到 **9/9**（＝ ρ 投遞通路真的是那個洞），
  還是不論 ρ capture 有沒有送達都停在 **0/9**（＝分歧在單段提交圖本身，即已知的
  `CGC_B_SCHEME` slot/mask 映射）？

# ── 【現狀】權威基線：數字 + 口徑 + 出處（出處檔案必須存在）──────────────────
baseline:
  metric: "單段臂 M1 **0/9**（M2 2/9、M3 0/9）；且 ρ 在單段臂上是**結構性 no-op** —— 池計數器與 prefetch 關閉那兩趟逐項相同：runtime requests=5976／hit 97.4%／miss 153 全 compulsory／evictions 41"
  cell:   "m123 oracle cell（`prefill250`：MTP on、pool 8 GiB、`LAYER_CAPS=40-40:256`、`CGC_NO_PREFETCH=1`）＋ `CGC_SEG_BATCH=1`；誠實臂＝同一組 env 但不開 `CGC_SEG_BATCH`"
  source: "docs/S2_S3_2026-09-30.md"
  source_note: "配對產物 Backup/m123_oracle_gate/summary_r6ctl-nosegbatch-2026-09-30.json（誠實／對照，9/9）與 summary_r6-segbatch-2026-09-30.json（單段，0/9）；兩份都帶 extra_env，`r6_witness.py` 判 WITNESS_RED。S2-b 的池計數器寫在該文的實測表。"
  known: |
    - ρ capture 的唯一呼叫點在 `llama-context.cpp:4837`，位於 `expert_cache_eval_cb`（:4798）內；
      而 SEG_BATCH 跳過的就是那個 hook（:4103）。`cgc_rho_prefetch` 的 `empty()` 守衛在 :4727。
    - 單段路徑**已經**在讀回時讀 `ibuf`（本步 routed ids）並數佔位：:`4102-4126`，
      餵料閘 `if (cgc_rb_seg_batch && (cgc_miss_mask_dbg || cgc_rb_feed))`（:4122）
      ⇒ 補一個 capture **不需要** hook、也**不需要**新的同步點（形狀與 P1 相同）。
    - ⛔ 量具陷阱：`CGC_MISS_MASK=1` 的變體 2026-09-30 實測引擎吐**全 NaN**
      （`non-finite values: 993280 of 993280`）⇒ 本卡**不得**用 `_DBG`／`_COST`；
      `CGC_RHO_PROBE`／`CGC_RHO_FILL` 已在 m123 的 `DIAGNOSTIC_KEYS`（以「主張待驗」登記）。
    - ρ capture 每層一次 `ggml_backend_tensor_get`（:4694，device→host 讀回）——
      這是**成本**不是免費：本卡的主端點是 M1（位元），**不得**把任何 t/s 寫進本卡的成績，
      新增的每層同步要當成「代價」回報（定價屬 S3-b）。

# ── 【假設】機制 + 預期（給區間、須有依據）────────────────────────────────
hypothesis:
  mechanism: |
    ρ 的價值鏈是「capture（影子 router 的 logits）→ 取 top-k 聯集 → 提前發 IO」。
    單段提交只砍了**第一段**：capture 掛在它跳過的 hook 上 ⇒ 影子 logits 永遠是空的
    ⇒ prefetch 在守衛就 return ⇒ 後面兩段從未執行。
    單段路徑的讀回通道已經在讀本步的 routed ids 與佔位計數 ⇒ 在**同一個點**補一次 capture
    是零結構成本的（不需 hook、不需新同步），而且它餵的是**下一步**的 prefetch，
    不受「本步路由已定、補不了本步」的限制 ⇒ 若分歧就是這條通路，池計數器必須先離開
    「prefetch-off 的常數」，M1 才有可能回到 9/9。
  expected: "M1 **0/9 → ≥8/9（目標 9/9）**、M2/M3 9/9；且池計數器離開常數（`CGC-RHO-CAP`／`CGC-RHO-FILL` ≥1 行、prefetch queued>0）。若 capture 送達而 M1 仍 ≤2/9 ⇒ 分歧在單段提交圖本身（slot／mask 映射）"
  basis: |
    docs/S2_S3_2026-09-30.md（S2-b 四趟：誠實臂 prefetch 開 89.2%→96.3%／686→163 證明 ρ 機制本身有效；
    單段臂逐項不變 ⇒ 通路關閉）；src/llama.cpp/src/llama-context.cpp:4102-4126（讀回通道）／
    :4664／:4708／:4727／:4798／:4837（capture 與 prefetch 的呼叫圖）；
    落地座標與**兩條實作**（(i) 在讀回區塊直接投遞＋呼叫 `cgc_rho_prefetch`；(ii) 把
    `ggml-backend.cpp:2604` 的 forwarding 接到單段路徑）逐行表：
    `docs/R6_SEGBATCH_FIX_PLAN_2026-09-30.md` §4.5（2026-09-30 對源碼複核）；
    docs/R6_SEGBATCH_FIX_PLAN_2026-09-30.md §四（S2-c 的定位與判別句）。

# ── 【預註冊判決規則（跑之前寫死，看到資料後不得改）】─────────────────────
acceptance:
  window_valid: |
    三件事各自成立才算可裁判：
      (a) 兩臂 rc=0 且跑完（沒被 watchdog／memory gate 擋下）；
      (b) `m123_oracle_gate` 兩份 summary 都 `comparable=True`、`config_diffs==[]`、
          同 `ref_md5`、同 `probe_prompt_md5`、同 `engine_digest`（跨 build 或跨參考 ⇒ 不結論）；
      (c) **見證行存在**：該趟 stderr 至少 1 行 `CGC-RHO-CAP`（或等價的 capture 見證）。
          0 行 ⇒ capture 沒有送達那個點 ⇒ 這一趟**無效**（先查 env 有沒有被 allowlist 丟掉、
          以及 hook-less 前置是否成立），**不得**把「沒量到」唸成「量到 0」而據此否證。
    ⛔ 本卡不要求乾淨窗：主端點是**位元**（M1）與**計數器**，不是配對 t/s ⇒ 髒窗仍可裁判。
  success: |
    單段臂 **M1 ≥ 8/9**（目標 9/9）且 M2/M3 9/9，同時
      (i) 池計數器**離開** prefetch-off 的常數（prefetch queued>0；`dropped/total` 不是 100%），
      (ii) ρ capture 見證行 ≥1，
    ⇒ 投遞通路成立、ρ 在單段臂上不再是 no-op；此時 20+ 臂回到正常判準（R6 的解除路徑）。
  falsify: |
    capture 見證行 ≥1（確實送達）而 M1 仍 ≤ **2/9** ⇒ 分歧**不在駐留／不在投遞**
    ⇒ 它在單段提交圖本身（slot／mask 映射）⇒ 本卡判死，S2 升級為引擎手術
    （docs/R6_SEGBATCH_FIX_PLAN §4.2：prev-token 預測 ＋ 逐層重算，走 D5）。
  undecidable: |
    capture 見證行 0 行 ⇒ 登記 UNRESOLVED（通路沒接上，不是假說錯），先解接線再重跑；
    或 `m123` 因 `config_diffs != []` exit 2 ⇒ 先解可比性，**不得**把 exit 2 唸成 M1 FAIL。
  on_fail: |
    判死 ⇒ 把結果回填 docs/R6_SEGBATCH_FIX_PLAN_2026-09-30.md §4.1 與本卡，
    不再為「補駐留／補投遞」投盒子，資源轉 §4.2 的引擎手術立項。
    ⛔ 任何情況下不得放寬 M1/M2/M3 護欄或改參考（那是口徑移動，須另開卡並經 operator 明講）。

# ── 【量化目標】機器可讀───────────────────────────────────────────────────
targets:
  decode_tps: 20.0          # 政策目標；本卡**不主張**任何 t/s 成績
  prefill_tps: 250.0
  m1_success_min: 8         # 成功門檻（≥8/9）；目標 9/9
  m1_falsify_max: 2         # ≤2/9 且 capture 已送達 ⇒ 判死，轉引擎手術
  rho_capture_lines_min: 1  # 見證行；0 行 ⇒ UNRESOLVED（不是否證）
  extra_sync_per_layer: 1   # 代價：capture 每層一次 device→host 讀回（不得算成免費）

# ── 【技術子目標】可量化、可驗收、貢獻可分──────────────────────────────────
subgoals:
  - id: sg-s2c-wire
    text:   "把 ρ capture 的觸發搬出 per-layer hook，接到單段路徑的讀回通道（`cgc_rb_seg_batch` 那一段）"
    expect: "hook-less 臂出現 ≥1 行 `CGC-RHO-CAP`；誠實臂行為不變（byte-identical）"
    how:    "llama-context.cpp:4102-4126 的讀回點補 capture；閘門沿用 `cgc_rb_seg_batch`"
