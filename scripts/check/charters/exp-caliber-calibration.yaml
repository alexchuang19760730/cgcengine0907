id: exp-caliber-calibration
owner: shared
created: 2026-09-28
axis: na

question: |
  ★ **2026-09-28 收斂後的結論：這是唯一還可量測的那一個問題。**
  見 docs/CONTRADICTION_CONVERGENCE_2026-09-28.md：擋住 25 的三個候選理由——
  IO（`io-shape` 2.9% < 3%，且 E-A 實測那條路只佔 f≈1.5%）、dispatch（`k3-price` 0.0195%/次，
  舊融合算術全作廢）、密集 kernel 頻寬（`c-bandwidth` 打滿 100% 也只省 2.42%）——**都已被量過並否定**；
  剩下的是 **`k3-swing` 的 16.4% 未認證飄移**。

  而**每一個「還差多少到 25」的數字都小於 16.4%**：S2 誠實天花板 +8.7%、
  「最後 3.5% acceptance」+3.5%、io-shape +2.9%、c-bandwidth +2.42%。
  ⇒ **在 16.4% 被配對認證關掉之前，「我們離 25 多遠」在度量上不可回答。**

  所以要回答的是：「交付口徑 12.57 t/s」與「DECPROF/round 口徑 207.8 ms step」之間的校準，
  以及那個 1.43× 飄移是視窗機械還是真訊號（n=5 時 t=2.08 未達 df=4 的 2.776）。

baseline:
  metric: "交付錨點 12.57 t/s（step_round ≈161 ms 反推）對 DECODE25 的 step_round 207.8 ms／9.7448 bench t/s"
  cell: "同機同模型；交付 cell 與 DECODE25 當輪是同一個盒子但不同記憶體水位（usable 59.2% / free 6.37 GiB）"
  source: "docs/DECODE25_CEILING_2026-09-20.md"

hypothesis:
  mechanism: |
    記錄裡至少有四個不同的「步」：DECPROF 的 work-row median（167.81 ms）、實付週期
    step_round = mean_len / tps（207.8 ms）、E2b 暖 total（139.46 ms）、以及 D0 探針的
    99.39 ms。t/s 的恆等式用的是 step_round，而「還差多少」的推算常誤用其他三個。
    ⇒ 校準缺失本身就是一個可交付物：它決定 19.25 / 22.9 / 24.15 / 18.7 這四個天花板
    哪一個才是同一個口徑下的 25 差距。
  expected: "若量到同一 run 內 t/s ≥ 12.57 且 step_round ≤ 160 ms，則 DECODE25 §3 的判決（k=3 不可達）被推翻"
  basis: |
    docs/DECODE25_CEILING_2026-09-20.md §6（它自己指名的唯一推翻方法）；
    docs/CONTRADICTION_CONVERGENCE_2026-09-28.md（收斂後：這是唯一還開著的量測）；
    docs/K3_SWING_ANALYSIS_2026-09-23.md／K3_PAIR_CERT_V2_BENCH_2026-09-23.md（n=5、t=2.08）

acceptance:
  success: "配對 n 加大到能認證：1.43× 飄移的配對 t 檢定達 df 對應的臨界值（關掉它）**或** 證明它是視窗機械造成的；並寫出交付口徑 ↔ DECPROF 口徑的換算（含不確定度）"
  falsify: "若 n 加大後 t 仍不過臨界值且效應量也不收斂，則把 16.4% 寫成常駐不確定度，並宣告所有小於它的「還差多少」數字在度量上不可比"
  on_fail: "不改任何目標數字；把口徑標註與 16.4% 噪聲底寫進 MEASUREMENT_CONTRACT，列為所有後續宣告的前置條件"

targets:
  decode_tps: 25.0
  prefill_tps: 250.0

subgoals:
  - id: sg-cal-together
    text: "同一 run 內同時取得 t/s 與 step_round（交付 cell）"
    expect: "0（這是量測能力，不是速度）"
    how: "prod_matrix / decode_sweep 的單一入口；warm-skip 段與 measured 段不可混用"
  - id: sg-cal-refute
    text: "§6 的推翻測試：t/s ≥ 12.57 ∧ step_round ≤ 160 ms 是否可能"
    expect: "若成立 ⇒ k=3 天花板由 19.25 上修；若不成立 ⇒ 判決維持"
    how: "同 run 配對；逐位元相同的 accept/mean_len 作為對照"

arms:
  - prod25
  - prod-new
