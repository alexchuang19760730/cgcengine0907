id: e-beyond-ceiling
owner: freebuff
created: '2026-09-29'
axis: both
question: 四塊裡哪一塊能超過它自己的已量上界（41.2 ms ＝ 24.3 t/s 是上界相加）？
baseline:
  metric: 四塊代入各自已量上界＝19.5＋12.0＋5.8＋3.9＝41.2 ms；目標 40.0 ms
