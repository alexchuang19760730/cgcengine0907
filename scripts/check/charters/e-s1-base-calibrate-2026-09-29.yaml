# 立項卡（2026-09-29，由 operator 的結案規則而生）：結案 = prod-new ＋ harness bench ＋ 達標
id: e-s1-base-calibrate
owner: freebuff
created: '2026-09-29'
axis: S
question: 同一組 S1 開關下，交付 cell 的 step 到底是 49.18 還是 36.80 ms（兩者差 12.4 ms）？
baseline:
  metric: 兩個底：49.18 ms（預設 cell，同場對照臂 11.714 t/s ＝ 錨點）／36.80 ms（交付 cell，attribution=swap 且帶 _DBG/_COST）
  cell: prod-new 交付 cell（p2048／-b -ub 5632／--warm-skip 64／fixed-fill-seed 1／reps 3）＋ S1 開關（CGC_SEG_BATCH=1;CGC_B_SCHEME=1;CGC_SLOT_TABLE_GPU=1）
  source: docs/MILESTONE_MAP_RECHECK_2026-09-25.md
hypothesis:
  mechanism: S1 一次提交 41 段 ⇒ 每步只有一次同步；兩個底的分歧只可能來自 cell（預設 vs 交付）或 debug 開關（_DBG/_COST 每步多一次 synchronize）。把兩者固定成同一組環境，差異只能歸給其中之一。
  expected: 口徑差 12.4 ms 收斂或被指名；天花板由未裁的 19.2–24.5 收斂成單一數（t/s）
  basis: §43（19.2 的底）＋ §35／§39（兩個底的來源）
acceptance:
  success: 同一組 S1 開關、同一 cell、乾淨窗口下成對重跑：兩者 CI 重疊，或差異被指名（並列出是哪一個變數）
  falsify: 差異被證明只是熱盒子機械 ⇒ 只能採用較嚴的底（⇒ 天花板 19.2）
  on_fail: 若無法取得乾淨窗口 ⇒ 維持未結案（不採用任何一邊寫進算式）
targets:
  decode_tps: 24.5
  prefill_tps: 250.0
subgoals:
- id: sg-base-pair
  text: 兩個底在乾淨窗口成對重跑
  expect: −12.4 ms/step 的口徑差被裁決
  how: 成對 median 與 CI（harness bench 產物）
- id: sg-base-dbg
  text: debug 開關（_DBG/_COST）對 step 的邊際成本指名
  expect: 0 ~ +0.5 ms/step
  how: 同 cell 開／關 debug 成對
arms:
- prod-new
- prod-new:CGC_SEG_BATCH=1;CGC_B_SCHEME=1;CGC_SLOT_TABLE_GPU=1
- prod-new:CGC_SEG_BATCH=1;CGC_B_SCHEME=1;CGC_SLOT_TABLE_GPU=1;CGC_MISS_MASK=1;CGC_MISS_MASK_DBG=1;CGC_MISS_MASK_COST=1

# ── 【子目標設定（由 decode_board_2026-09-29.yaml 的 L20-1 同步；勿手改，改看板）】──
options:
  subgoal: L20-1
  profile: prod-new
  arms: []
  knobs:
    - {name: CGC_SEG_BATCH, value: "1", role: subject, why: "單段提交：41 段→1 段，本格要校準的就是它的 step", source: "charters/e-s1-base-calibrate arms[]"}
    - {name: CGC_B_SCHEME, value: "1", role: subject, why: "段內 slot 指派方案", source: "同上"}
    - {name: CGC_SLOT_TABLE_GPU, value: "1", role: subject, why: "讓 leaf 被建（G3 的前置）", source: "同上 + 實跑 arm"}
    - {name: CGC_MISS_MASK, value: "1", role: instrument, why: "miss 遮罩計數，不改演算法", source: "node exp-prodnew-decode20-g4miss 實跑 arm"}
    - {name: CGC_MISS_MASK_DBG, value: "1", role: instrument, why: "逐層 miss 明細", source: "同上"}
    - {name: CGC_MISS_MASK_COST, value: "1", role: instrument, why: "miss 重算成本計時", source: "同上"}
  # 以下臂已被判準刪除（不能量交付目標）：定義在 scripts/check/quote_gate.py 的 R5／R6；
  # 逐子目標的理由與規則見看板同一格的 options.arms_removed。
  arms_removed:
    - arm: "prod-new:CGC_SEG_BATCH=1;CGC_B_SCHEME=1;CGC_SLOT_TABLE_GPU=1"
      rules: [R6]
      flags: { CGC_SEG_BATCH: R6 }
      why: "這一格的數（27.53／36.33 ms）只能從單次提交臂出來，而單次提交臂的 t/s 與交付目標不是同一個函數（R6）。"
  note: "控制臂＝裸 prod-new；成對重跑（交付 cell、MTP off、warm-skip 64）。底 36.80 ⇒ 天花板 24.5；底 49.18 ⇒ 19.2。"
