    5) 收貨：`--check` 轉 RUNNABLE；交付臂 summary 的 `extra_env['CGC_RHO']=='1'`（旗標真的進了子行程）；
       交付臂**伺服器 log**（banner 的 `[log] <path>` 指名那一份）`grep -c 'CGC-RHO-'` ＝ 0。
       ⚠ 不要 grep `launch_<tag>.log`：那只是 banner，永遠是 0（一個假的綠）。
       池的 `prefetch=N/M` 在伺服器 log 上；ρ 的貢獻看 S3/S4 的**差分**（證據，不是價格）。
    6) 四條權威 row 命令（`--plan`）＋ `--judge`（兩趟反序）⇒ 期望 PRICE（`NO_EFFECT` 也是合法結局）
