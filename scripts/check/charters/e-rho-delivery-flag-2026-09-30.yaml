    手動版（腳本內用的就是這幾條；全文見 docs/RHO_PRICE_AUTHROW_2026-09-30.md §6）：
    0) python3 scripts/check/rho_price_authrow.py --checklist      # 清單＋補丁 md5／base 驗證
    1) git apply --3way Backup/rho_split_2026-09-30/rho_delivery_split.patch    # 在擁有 src/ 的那棵樹
    2) cmake --build src/llama.cpp/build --target llama-server llama-bench -j 8
    3) 對照臂（可重用同 build 的錨）：
       python3 scripts/check/m123_oracle_gate.py --profile prefill250 --tag rho-split-ctl-<日期>
    4) 交付臂：
       python3 scripts/check/m123_oracle_gate.py --profile prefill250 --tag rho-split-deliver-<日期> --env CGC_RHO=1
