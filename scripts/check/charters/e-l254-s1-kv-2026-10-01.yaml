  receptor: "docs/OPERATOR_RULING_L254_2026-10-01.md §「S1 第一趟：發車前預註冊」（端點讀法、窗口合格條件、kill line）"
  evidence: "Backup/l254_s1_20261001/k7_paired.json 與 k7_paired_clean.json（＋對應 `.stderr.log`；兩趟）"
