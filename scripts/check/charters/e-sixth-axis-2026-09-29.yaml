  subgoal: L25-1
  profile: prod-new
  arms:
    - "prod-new"
  knobs:
    - {name: --spec-type, value: "ngram-simple", role: subject, why: "被測 PRIMARY：用上下文自己的 n-gram 起草，**不需要 draft head**；且 `need_n_rs_seq()` 對它回 **0** ⇒ 結構上不觸發 M2 的輸出函數改變（那正是 MTP 被判產品決策的原因）", source: "common/speculative.cpp:1998（need_embd=false）；common.h:395"}
    - {name: --spec-ngram-simple-size-n, value: "4", role: subject, why: "lookup n-gram 長度（E 對它敏感 ⇒ 要掃）", source: "src/llama.cpp/common/arg.cpp:4129"}
    - {name: --spec-ngram-simple-size-m, value: "8", role: subject, why: "draft m-gram 長度", source: "同上 :4139"}
    - {name: --spec-ngram-simple-min-hits, value: "2", role: subject, why: "最小命中數（直接決定 E）", source: "同上 :4149"}
    - {name: CGC_SERVER_LOAD_MODE, value: "mmap", role: candidate, why: "被測 SECONDARY：dense 段由匿名頁變可回收檔案頁 ⇒ 降落到 SSD 的比例 f（§7：f 20% ⇒ 85.9 ms；25 t/s 要 f ≤7.9%）", source: "scripts/run_server.sh:513-518（預設 none）；docs/DECODE25_CEILING_2026-09-20.md §7"}
