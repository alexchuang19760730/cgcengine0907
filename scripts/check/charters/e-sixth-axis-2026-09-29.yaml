# ── 【假設】─────────────────────────────────────────────────────────────
hypothesis:
  mechanism: |
    25 需要的不是把某一段變快，而是改變乘數：每 token 的 bytes（權重／專家位元組）或
    steps（每 token 的步數）。**優先序由 bytes 的結構決定**：
    每 token 1.171 GB 裡只有 **381 MB（33%）**是會 miss 的專家段，**790 MB（67%）**的 dense 段
    常駐 RAM ⇒ **bytes 類的候選最多只能動那 33%**；**steps 類（每步多 token）對兩半都有效**
    ⇒ 這就是為什麼 `ngram-spec` 排第一，而不是任何 bytes 類候選。
  expected: "缺口 45.45 ms 需要一個新乘數 ⇒ 目標 ≤40.0 ms／≥25.0 t/s；找不到就維持判死"
  basis: "§39 §五（兩條路：第六條軸或超過上界）"

# ── 【驗收】─────────────────────────────────────────────────────────────
acceptance:
  success: |
    指名至少一個可改的乘數，且它落在 **≤40.0 ms** 且 **M1 bit-identical** 的形狀上。
    ★ 對 steps 類候選（ngram），這條展開成三個子條件：
    ① 結構前提：`need_n_rs_seq() == 0`（**已由源碼讀得**，本卡只覆核）
    ② `E = emit_tok_per_round > 1`（真的有攤薄發生）
    ③ 輸出同一：`answer_md5` 與 MTP-off 對照臂**相同**，且 ON 自身重跑 identical
  falsify: |
    找不到候選乘數 ⇒ 25 維持判死（判詞不改）。
    ★ 對 ngram：若 ③ 不成立（輸出不同）⇒ **它與 MTP 同類**（產品決策，不是本線槓桿）；
    若 ② 不成立（E ≤ 1）⇒ 這個乘數不產生攤薄，回到「以現有軸加總到不了」。
  on_fail: "維持判死；把「已找過哪些乘數、各為何不行」寫進卡片（本檔 inventory 就是第一版）"

targets:
  decode_tps: 25.0
  prefill_tps: 250.0

# ── 【技術子目標】─────────────────────────────────────────────────────────
subgoals:
  - id: sg-6th-inventory
    text: "唯讀盤點：每 token 的 bytes 與 steps 各有哪些可改項、量級多少、能不能 M1 相同"
    expect: "候選清單 ＋ 各自量級 ＋ 現況"
    how: "讀 §39／`DECODE25_CEILING` §7 §8.1／`run_server.sh` 的旋鈕清單"
    state: DONE
    result: "本檔 inventory：7 個候選，1 個 PRIMARY（ngram-spec）、1 個 SECONDARY（load-mode）、5 個已判"
  - id: sg-6th-ngram
    text: "量 `--spec-type ngram-simple`：E 與輸出同一性"
    expect: "`E > 1` ∧ `answer_md5` 與對照臂相同 ∧ ON 自身重跑 identical"
    how: |
      同 cell 兩趟（**A 對照＝裸 prod-new、B＝`--spec-type ngram-simple`**）＋兩臂都帶
      `LLAMA_BENCH_SPEC_DBG=1`（每輪見證）／`CGC_MTP_PERF=1`／`CGC_LOGITS_ORACLE_DUMP=<各自的路徑>`。
      ⛔ `--spec-type` **不是 env**（走 CLI），且**三顆 `--spec-ngram-simple-*` 在 bench 上會被拒**
      ⇒ 只能跑編譯期預設。
    state: DONE
    result: |
      ② **不成立：E ＝ 0.984**（6/6 rep 一致；archive 的 map-k 0.992）⇒ 依否證條款，這個乘數不攤薄。
      ③ 未量到、且不改變判決：`cgc_logits_oracle_compare.py` 兩種對齊都不成立
      （step：common 390／only_B 768；pos：keys_common 4）⇒ 那 39% 的 M2 **不能**讀成「輸出不同」
      （dump 是每次 context decode 落一筆，而投機臂的 forward 份數本來就不同）。
      全文 `docs/SIXTH_AXIS_NGRAM_2026-09-30.md`。
  - id: sg-6th-loadmode
    text: "量 `CGC_SERVER_LOAD_MODE=mmap`：它動的是「誰在搶實體記憶體」⇒ 有效池容量（§8 的『裝得下』類），不是 bytes"
    # ── 【預註冊（2026-09-30 01:2x，寫在跑之前）】──
    # 端點全部是**計數器＋輸出同一性**；t/s 一律 VOID（`CGC_MISS_MASK_HIST` 在 R5 名單，
    # 且盒子可回收只有 ~4.8 GB ⇒ attribution 大概率 swap ⇒ 本來也不可引用）。
    expect: |
      兩趟（A 對照＝裸 prod-new；B＝以上＋CGC_SERVER_LOAD_MODE=mmap），都掛
      `CGC_MISS_MASK=1;CGC_MISS_MASK_HIST=1` ＋ `CGC_LOGITS_ORACLE_DUMP=<各自路徑>`：
      ① 主端點（計數器，髒窗可判）：穩態的 **miss/step** 與 **有 miss 的層數**（A 對照的已知水準：
         ~74 miss/step、27.96/40 層）；
      ② 同一性：兩臂**都不是投機臂** ⇒ forward 份數相同 ⇒ `--align step` 必須成立
         （common == 全部；這是第一次能真正判 ③ 的機會，ngram 那輪因對齊失敗只能記 UNDECIDABLE）。
    succeed_if: "B 的 miss/step 或有 miss 的層數相對 A 降 >10% ⇒ 找到第六條軸的第一個真乘數 ⇒ 再跑乾淨成對取可引用 t/s"
    falsify_if: "Δ ≤ ~5% ⇒ load-mode 不動 miss 桶 ⇒ SECONDARY 否證；引擎側候選窮盡（PRIMARY ngram 已否證）⇒ **25 定案：判死**（引擎候選窮盡 ＋ 唯一有算術的模型側槓桿『降專家 bpw』已被 operator 禁止）。力氣回 L20（20+，天花板 19.2–24.5）與 L25-4 的口徑決策"
    how: |
      `python3 scripts/check/harness.py bench --arm "prod-new:CGC_MISS_MASK=1;CGC_MISS_MASK_HIST=1;CGC_LOGITS_ORACLE_DUMP=<path>" [--arm 內再加 CGC_SERVER_LOAD_MODE=mmap]`
      ＋ `--charter scripts/check/charters/e-sixth-axis-2026-09-29.yaml`（reps 3 權威 cell）。
      直方圖在**原始 stderr**（`*.json.logs/live/*.stderr.log` 的 `CGC-MISSMASK-HIST`／`CGC-MISSMASK-STEP`）；
      對齊比較用 `cgc_logits_oracle_compare.py --a A_oracle.jsonl --b B_oracle.jsonl --align step`。
      ⚠ `CGC_SERVER_LOAD_MODE` 已用 `arm_env_dropped()` 驗過真的到達（09-30，回空清單）。
    state: BLOCKED
    result: |
      **兩臂都在起跑前被閘門擋下（2026-09-30 01:20），0 秒失敗、沒有浪費機器**：
      ① A 臂被<b>壓縮機閘</b>擋（`compressor BUSY`，rc=2）；
      ② B 臂過了壓縮機，卻被 <b>cell contract</b> 擋（fail-closed）：
         `load_mode: 實際 'mmap' ≠ 權威 'none'` ⇒「請走生產入口的預設，或<b>顯式對齊測試卡 §2.5</b>」。
      ★★ **這條才是真正的發現**：`CGC_SERVER_LOAD_MODE` 是 <b>cell 級欄位</b>，不是 arm 級旋鈕 ——
      `arm_env_dropped()` 只回答「鍵有沒有到引擎」（它回答：有），**不回答「改它算不算改量測條件」**；
      改 load-mode ＝ 換 cell ＝ 換量測契約 ⇒ 必須先在測試卡 §2.5 <b>新增一格</b>（同 L20-10 的情況），那是權威決策。
      ⇒ 本子目標的卡點＝那個決策；在那之前 L25-1 的 SECONDARY **不可跑**。

