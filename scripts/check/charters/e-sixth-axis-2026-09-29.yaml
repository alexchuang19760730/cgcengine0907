# ═══════════════════════════════════════════════════════════════════════
# 第六條軸（Campaign charter）—— 「每 token 的乘數」：bytes 或 steps
# ═══════════════════════════════════════════════════════════════════════
# 為什麼要有這張卡：§39 把 ms 軸與段數軸都量空了，並把 25 t/s 的最後兩條路寫成
#   (a) 找到第六條軸（改**每 token 的 bytes 或 steps**，而不是每步的 ms）
#   (b) 讓某一格超過自己的已量上界
# 這張卡只做 (a)。它的第一個產出是「有無候選」的判定，不是實作。
#
# ★★ 2026-09-29 23:5x 補：**候選清單已盤完（唯讀，0 跑）**，而且找到一個真的新候選 ——
#   `--spec-type ngram-*`。關鍵在源碼：`common.h:395 need_n_rs_seq()` 只對
#   **DRAFT_MTP／EAGLE3／DFLASH／DSPARK** 回 `draft.n_max`，**ngram-\* 與 draft-simple 回 0**。
#   而 MTP 之所以是「產品決策」（C6）而不是本線槓桿，正是因為 `n_rs_seq > 0` 讓它變成
#   **不同的輸出函數**（M2 FAIL）。⇒ **ngram 投機在結構上不經過那條路**，
#   它有機會同時是「乘數」又是「同一個輸出」—— 那會讓 (a) 第一次變成可判定的問題。
#   ⚠ 「結構上不經過」是**讀源碼得到的推論**，不是量測 ⇒ 本卡的 sg-6th-ngram 就是去量它。
id: e-sixth-axis
owner: freebuff
created: '2026-09-29'
axis: both

# ── 【目標】─────────────────────────────────────────────────────────────
question: |
  本步的 bytes 或 steps 有沒有可改的乘數（＝不是把 ms 變小，而是讓每 token 的份數變少）？

# ── 【現狀】─────────────────────────────────────────────────────────────
