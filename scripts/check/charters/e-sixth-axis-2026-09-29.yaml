  metric: "現有軸（ms、段數、kernel、IO）全量完；交付 85.45 ms、缺口 45.45 ms；P(25)<3%"
  cell: "prod-new 交付 cell（`-p 2048 -n 128 -d 512 -r 3 -b/-ub 5632 --warm-skip 64`）"
  # ⚠ `source:` 要是**一個存在的路徑**（charter gate 會 os.path.exists 它）；節號與說明放 `source_note`。
  #   2026-09-30 第一版把「§39（C1–C7…）」寫進 source ⇒ 閘門拒跑（rc=2），兩臂都發不出去。
  source: "docs/SINGLESUBMIT_CORRECT_DESIGN_2026-09-28.md"
  source_note: "§39：C1–C7 的條件清單 ＋ 把「已量到」按可回收性分四級的槓桿清單"
  known: |
    - §39 §三 C1：把四塊各自推到**自己的已量上界**相加 = 41.2 ms = 24.3 t/s < 25
      ⇒ 「以現有的軸加總到不了」。C6 明寫：「若要靠每步多 token 攤薄固定成本，必須先把 MTP-on
      變成交付口徑」——並把它裁成**產品決策**。本卡要問的正是：**除了 MTP 還有沒有別的乘數**。

