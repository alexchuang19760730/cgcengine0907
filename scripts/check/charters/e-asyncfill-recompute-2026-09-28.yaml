          ⇒ 單一 expert 的算術只由 (ne0, neh1[im], id, tile 座標) 決定，
             **與這次呼叫帶了幾個 id 無關** ⇒ 拆成兩次呼叫，逐 expert 值不變。
          swiglu 與 `ggml_mul(experts, weights)`（:2852）逐元素、逐列 ⇒ 也不跨界。
      - id: j1-c
        claim: "原位寫回機制存在，Metal 有 kernel，限制滿足"
        where: "ggml.h:935-943、:1630-1670；ggml-metal-ops.cpp:343；ggml-metal-device.m:1194"
        detail: |
          `ggml_acc` 註釋原話「dst = a; view(dst, nb1..nb3, offset) += b」
          ⇒ **byte offset ＋ 累加**，正是「把 C 那一列加回它在 experts 的原始偏移」。
          Metal 有實作，限制 `contiguous_rows` 且 `src0->type == F32`；
          本路徑 `experts` 是 F32、decode 時 n_tokens=1 ⇒ 單列連續 ⇒ **限制滿足**。
          ⚠ `grep ggml_acc(` 在 `src/llama.cpp/src/` **0 命中** ⇒ 新路徑，無既有範例可抄。
      - id: j1-d
        claim: "寫入精確性：遲到列必須先是精確 0"
        detail: |
          `ggml_acc` 是 `+=` ⇒ 列裡有殘值就不等價。精確 0 的兩條來源：
            (a) 顯式 zero-fill；(b) zero slot（G3，`llama-context.cpp:3745-3815`）
            讓缺席 expert 的 down 輸出 = 0，再 `ggml_mul(weights)` 仍 = 0。
          IEEE：`+0 + c = c` 對所有有限 c 精確。
          ⚠ 唯一邊界 `+0 + (-0) = +0`：若 c_i 恰為 `-0`，符號位與原式不同
            （數值相等，且 add 鏈下游 `x+(-0) == x+(+0)`）⇒ **已知邊界，非 blocker**。
