            （偏移 = `i*nb[1]`，i 是 **ids 陣列裡的位置**）
            ⇒ :2919-2941 `moe_out = ((((c0+c1)+c2)+…)+c_{k-1})`，k = `hparams.n_expert_used`。
      - id: j1-b
        claim: "每個 c_i 與批次組成無關（列獨立）⇒ C 遲到不改動 H 任何一列"
        where: "ggml-metal.metal:10716-10754；llama-graph.cpp:2623,2637-2640,2838,2852"
        detail: |
          `kernel_mul_mm_id`：`im = tgpig.z`（:10723，註釋原話「// expert」）、
          `id = ids_i32[im*args.ne21 + r1 + lr1]`（:10748）、`neh1 = tpe_u32[im]`（:10730）；
