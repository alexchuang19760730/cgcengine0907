# ── 【預註冊判決規則（寫死，看到資料後不得改）】─────────────────────────
acceptance:
  window_valid: |
    同時成立才算該趟可裁判：
      (a) 起跑 thermal = NOMINAL；
      (b) 見證行生效（缺 ⇒ 旋鈕被 allowlist 丟掉 ⇒ 無效，不結論）；
      (c) 趟完成（rc=0、3 個 tg rep）；
      (d) M1 判決前先確認 coverage 與鍵碰撞（`quote_guard`）。
  success: |
    Q1 為是（M1 9/9 且 M2 9/9、config_diffs=[]）**且** tg ≥ 13.6。
  falsify: |
    Q1 為否：D1 在「保留單一 combine、寬度 k、位置序不變」的條件下，
    M1 仍 < 1.0 ⇒ **判死**。理由要寫明是拆不出「位元一致的 scatter」
    （例如 C 的輸出無法無成本地寫回原始位置），而不是「做得不夠好」。
  undecidable: |
    M1 因 config_diffs ≠ [] 而 exit 2，或 coverage < 100% 且鍵碰撞警告在
    ⇒ 登記 UNRESOLVED，先解可比性，不得把 exit 2 唸成 M1 FAIL。
  on_fail: |
    若 falsify：**不得放寬 M1/M2/M3 護欄**——那是「口徑移動」不是「修好」，
    需另開一張卡並經 operator 明講（參照 MTP B 卡的前例：那次是因為
    `n_rs_seq` 導致計算份數本身改變，才走口徑重定義；本項若只是加法順序不同，
    **不構成放寬理由**）。
    ⇒ 判死後寫 deadend 結案，改回主線 gap/wait 桶，不再往「把 miss 移出臨界
    路徑」投入。

# ── 【★ 結案（2026-09-29 02:1x）—— 依 fill_budget_closure 的實測落點】──────
final_disposition:
  status: "🔴 **CLOSED — 建議不做**（不是判死，是判「不值得」）"
  decided_by: |
    不是 M1 破產，而是**收益低於可量測門檻**：
      `e-fillbudget-m-decomp.result_p1`（交付 cell，1 趟，儀器已修好）
      fill **p50 = 5.41 ms/step**（預算 86.13）⇒
      落點 1000/(86.13 − 5.41 + J2) = **11.92–12.15 t/s（+2.6%~+4.6%）**
      ⇒ **< MDD 8.5%** ⇒ 在 16 GB 盒子上量不出來。
  why_not_just_do_it: |
    ⛔ 它需要動 `src/` 且**碰 M1/M2/M3 護欄**（改 combine 的加法順序／寫回位置）。
    「動護欄去換一個量不出來的 2.6–4.6%」是本專案明確禁止的交換
    （參照 MTP B 卡前例：護欄只能在口徑被證明必須移動時才動）。
  survives: |
    ✅ 保留（作為知識，不是作為工單）：
      - **J1 原理可行**：未融合路徑（`CGC_DOWN_COMBINE` `<unset>`）下，D1 的 M1
        原理成立（列獨立／`ggml_acc` 原位寫回／`+0` 精確）。
      - **J2 成本模型**：靜態圖 ⇒ 固定 `k×n_layer = 8×40 = 320 op/step`，與 miss 率無關。
      - **EBTIMER `seg=` 欄位**（已落地，`e-fillbudget-m-decomp` 的 src/ 改動）：
        這是本線留下的**永久資產**，不受本卡結案影響。
  voided: |
    ⛔ 作廢：P0 的整段論證（裁的 `sum_rows` 不參與 combine）、「~12 op/step」、
    「14.1~19.9 t/s」與「12.9~19.4 t/s」兩個落點區間、J2 的 312（應為 320）。
  reopen_condition: |
    只有在**兩條同時成立**時才重開：
      (a) 盒子換成 ≥32 GB（pool 不再有 ~4.4 GiB 落在 swap ⇒ `cb` 桶消失 ⇒
          step 預算與 fill 的相對關係改變）；**且**
      (b) 重新實測 fill ms/step ≥ 8.5% × step 預算。
    ⛔ 單獨「髒窗讓數字難看」不構成重開理由。
  owner_note: "owner 從未明文指派 ⇒ 本線依 `on_fail` 自行結案，不實作、不開工單。"

# ── 【階段（Q1 沒過不得進下一階段）】────────────────────────────────────
phases:
  - id: P0
    status: "⚠️ 結論方向對、**論證作廢**（2026-09-29 查證：裁的 kernel 不參與 combine）—— 見 `p2_adjudication.J1_m1_life_or_death.evidence.j1-a`"
    text: |
      **裁決 09-19 的判死前提**。讀 `ggml-metal.metal:1721-1778`
      `kernel_sum_rows_impl` 全本。
      ⛔ **2026-09-29 更正**：`ggml_sum_rows` 在 MoE 裡只服務 `norm_w` 的權重
      歸一化（`llama-graph.cpp:2589`），**不是 expert 聚合** ⇒ P0 的 verdict (a)(b)(c)
      針對的是一個不參與 combine 的 kernel，整段作廢。真正的判定見 `p2_adjudication`。
      （P0 的**結論**「D1 不判死」仍成立，但理由完全不同。）
    verdict: |
      **(a) 09-19 對機制的描述是錯的。** 實際是三層，不是「依序相加」：
        ① `:1748-1750` 每執行緒**跨步**累加 `for(i0=tpitg.x; i0<ne00; i0+=ntg.x)`；
        ② `:1752` `simd_sum`（蝴蝶，32 lane）；
        ③ `:1756-1763` 各 simdgroup 的 lane0 寫 shmem → barrier → `simd_sum` 跨 simdgroup。
      **(b) 樹形由 `(ne00, ntg.x)` 決定**：`ne00`（＝k 寬度）與 dispatch 的 `ntg.x`
        不變 ⇒ **整棵樹與原本同形**，與 09-20 §(1) 的記載一致。
      **(c) ⇒ 09-19:263-267 的反證對 D1 不適用**：D1 保留單一次 combine、
        ne00=k 不變 ⇒ 歸約樹逐位元同形。它被證的是 D2（combine 也拆）。
      **(d) ⇒ 瓶頸不是 IEEE，是圖建構**：剩下唯一問題是「C 組的 matmul 輸出能否
        寫回它在 routed order 的**原始偏移**」——ggml 的 op 自備 dst，
        要寫進既有 tensor 的偏移需要 view／scatter，**這份成本從沒估過**。
        ⛔ 若只能 `concat` 成 [H|C]，位置序就變了 ⇒ 退回 D2 ⇒ 判死。
      **(e) ⇒ 「位元一致性擋死」對 D1 是過強的結論，應改寫**；本項**不是死的**。
        但已知「位元一致又安全」的子集仍只有同層獨立工作（shared expert
        `ffn_*_shexp`，約該層 FFN 20–25% ⇒ 只蓋 ~1/4 的 cb）。
    exit: "已裁決：進 P1。⛔ 若 P2 證明只能 concat ⇒ 立即判死，不進 P3。"
  - id: P1
    text: |
      **第一個 commit 不是 kernel**：把缺席 expert 的貢獻從「`e % ns` 別人的權重」
      換成 0。

      ✅ **已落地（2026-09-29 查證更正）＝ G3，不需要再寫**：
        實作在 `llama-context.cpp:3745-3815`（B-scheme slot table writer）：
          `zs >= 0` ⇒ `v = zs`（dropped: **exactly zero weights**）；
          否則 ⇒ `v = e % ns`（placeholder，註釋原話 "legal-but-wrong, and counted"）。
        專用旋鈕 `CGC_ZERO_SLOT=1` 已於 09-26 加進 `scripts/run_server.sh` allowlist
        （:1752-1753），`zero_slot_enabled()`（`llama-expert-cache.cpp:311-313`）已含它
        ⇒ **gate 早已放寬，不必動線 I 的檔**（推翻開卡時「gate 要放寬」的記載）。
        binary 已含：`strings -a libllama.0.dylib | grep -c CGC-G3-ZEROSLOT` = **2**
        （build 630，09-28 13:55）⇒ **0 build 即可跑**。

      ⛔ 開卡時引用的行號**是錯的，勿再引用**：`llama-expert-cache.cpp:277-282`
        是驅逐邏輯、`:292-316` 是 zero-slot 的 MTP fast path、`llama-graph.cpp:2718`
        是 gelu；**`CGC_ZERO_MISS` 在 `src/` 裡 0 命中（該 env 不存在）**。
    exit: |
      ⛔ **原 exit「M1 9/9 M2 9/9」作廢**。源碼註釋（`llama-context.cpp:3768-3772`）
      原話：「That is **NOT** bit-identical to the segmented arm, and **it is not meant
      to be**」—— zero slot 是把 unbounded error（別人的權重）換成 bounded／
      deterministic／interpretable 的 0，**故意不 bit-identical**。
      要求它 M1 9/9 是**原理上不可能達成**的門檻（且原文已寫 "A zero slot does NOT
      make G1 pass"）。

      正確 exit（見證行，0 build、1 趟、`--arm 'prod-new:CGC_ZERO_SLOT=1'`）：
        `CGC-G3-ZEROSLOT: il=.. ns=.. zero_slot=<N>`  ⇒ N>=0 = armed（<0 = 仍 placeholder）
        `CGC-G3-ZEROSLOT-TOTAL: zero_slot=<N> placeholder=<M>` ⇒ 要求 M == 0
      ⇒ **bit-identical 只在 P2 補算之後才可能成立**（0 貢獻 ＋ 補算 ＝ 原值），
        不得拿 P1 單獨的存在門檻去判它。
