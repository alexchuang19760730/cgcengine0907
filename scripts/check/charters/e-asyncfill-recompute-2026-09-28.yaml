        (i)   combine 的每一項 c_i 與「同批帶了哪些 expert」無關（**列獨立**）；
        (ii)  C 的值能在 combine 執行前寫回它在原張量裡的**原始偏移**；
        (iii) 該寫入精確（不是「把真值加到一個不為 0 的殘值上」）。
    verdict: "✅ **M1 原理上成立（D1 不判死）** —— 三條全過。"
    evidence:
      - id: j1-a
        claim: "真正的 combine 是左結合 add 鏈，不是 sum_rows ⇒ P0 論證作廢"
        where: "llama-graph.cpp:2589 vs :2863-2941"
        detail: |
          `ggml_sum_rows` 在 MoE 裡唯一一處是 :2589 的 `weights_sum`（`norm_w` 歸一化），
