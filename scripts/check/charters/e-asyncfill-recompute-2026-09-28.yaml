id: e-asyncfill-recompute
owner: |
  未明文。09-26 §EN-150 記「第 3 步 kernel 的 owner 未明文」至今未決。
  本線（線 A＝S1／段邊界／wait·gap）出卡；kernel 實作需先定 owner。
