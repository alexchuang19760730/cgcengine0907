# ═══════════════════════════════════════════════════════════════════════
# 實驗立項卡（Charter）—— e-spec-tree：樹式驗證（把部分接受的整輪重驗換掉）
#   L25-4 的續篇；設計文 docs/SPEC_TREE_VERIFY_DESIGN_2026-10-02.md
# ═══════════════════════════════════════════════════════════════════════
# 為什麼要立這一張：
#   L25-4 判 MTP 軸 DEAD，前提是「鏈式 spec 的最佳點 k=2 仍 −5.4%」。而鏈式有兩個結構缺陷：
#     (i)  部分接受 → `ckpt.load_tgt()` ＋ `continue` ⇒ **整輪重驗、零產出**，且隨 rep 上升（2/24→…→20/46）；
#     (ii) **沒有候選可選** ⇒ EcoSpec / AcceptMoE / EVICT 那一族（成本感知 draft 選擇）
#          全部假設 draft **樹** ＋ 樹式注意力，對我們無從下手。
#   本卡＝把那筆重驗換成樹式驗證（一次 target forward 驗多條路徑），**先問最窄的樹有沒有用**。
# ⚠ 主要約束（今日實測，docs/MTP_AXIS_REOPEN_REVIEW_2026-10-02.md §8.3）：
#   MTP-on 已把每層支持集推出池外（distinct 中位 139→205；超 143 槽 41/41；每步 union u/req 0.750）
#   ⇒ 樹把 verify batch 加寬 = 更多冷專家。**所以 T1 必須又窄又淺，且必須同時報 hit%/misses。**
# ⚠ 未被看板登記：`mindmap_subgoal_sync.py --check` 只走「看板 → 已登記的立項卡」，
#   本檔不在看板的 subgoal.charter 清單內 ⇒ 對該閘**不可見**（該閘基線已有 3 處既存缺口）。
id: e-spec-tree
owner: 線A（engine / spec）
created: '2026-10-02'
axis: S

# ── 【目標】──
question: |
  把 verify 從「單條鏈」換成「深度 1 分支、b=2 的最窄樹」（根掛 seq{0,1}；分支 A ＝ MTP 第 1 位的
  第 1 候選續走，分支 B ＝ 第 1 位的第 2 候選續走），一次 target forward 驗完：
  ⇒ 若 replay 比例顯著下降 ∧ emit_per_round 上升 ∧ 同 session 配對差 ≥ +5%
    ⇒ 樹式成立，MTP 軸重開，且 EcoSpec 類（成本感知 draft 選擇）才有立足點；
  ⇒ 否則 ⇒ 「樹式在 16 GB 盒上不成立」，MTP 軸依 L25-4 收束，預算移出。

# ── 【現狀】──
baseline:
  metric: "鏈式 k=2（同 session、乾淨窗）：**10.902 t/s**（off 11.524 ⇒ −5.4%）；真 `emit_per_round` **1.625**；
           `rounds` 120 / `calls_draft` 142 / `n_done` 195；replay **66/208 = 31.7%**；pool hit **60.6%**、misses **8741**"
  cell:   "交付 cell（`delivery`：`-b/-ub 512`、`prompt 0`、`gen 128`、`depths 512`、`reps 3`、`warm-skip 64`、`ctx_size 4096`）
           ＋ `--spec-type draft-mtp --spec-draft-n-max 2`"
  source: "Backup/l254_kaxis_20261001/k2.json"
  source_note: "成本律與 replay 口徑見 docs/L254_K_AXIS_ECON_2026-10-01.md（§量具修復 :93-113）；成本律 round_ms ≈ 63.6 + 35.2·T̂（:105）"
  known: |
    - 每輪固定項 **0.73 個純解碼步**；邊際 verify token **0.41 步**（攤薄是真的）。
    - replay 是**純浪費**（一次完整 verify decode、零產出、不呼叫 drafter），比例隨 rep 上升。
    - 鏈式沒有候選選擇空間 ⇒ 文獻那族（EcoSpec/AcceptMoE/EVICT）在我們的鏈上**無從下手**。
    - ★ 今日：MTP-on 把支持集推出池外（distinct 中位 139→205；**41/41 層超 143 槽**）
      ⇒ 樹的**主要成本風險**在這裡，不在算術。

# ── 【假設】──
hypothesis:
  mechanism: |
    部分接受時，鏈式要**整輪重驗**（把已接受的 ids 當下一輪 draft 再 verify 一次）；樹式把
    「候選分支」在**同一次 forward** 裡驗完 ⇒ 同樣的 GPU 工作換到**更多有效產出**，
    且部分接受不再是「全丟」而是「選勝出分支」。
  expected: "replay 比例 31.7% → <10%；`emit_per_round` 1.625 → ≥1.9；同 session 配對差 ≥ +5%"
  basis: "L254 的 replay 帳（66/208）＋ 成本律（每輪固定項 0.73 步 ⇒ 少輪 = 直接省固定項）＋ examples/speculative 的樹式模板"

# ── 【驗收】跑前寫死 ──
acceptance:
  success: "機制端點：replay 比例 **<10%** ∧ `emit_per_round` **≥1.9**；速度端點：同 session ABBA 配對差 **≥ +5%**"
  falsify: "任一成立即判「樹式在 16 GB 盒上不成立」並收束本軸：① 配對差 ≤0；② replay 相對降幅 <20%；
            ③ pool `misses` 漲幅 > `emit_per_round` 漲幅（＝多驗的 token 被 IO 吃回去）"
  on_fail: "任一臂 `attribution≠none` ⇒ 該臂 t/s 不引用（機制計數器仍可讀）；超過兩臂不合格 ⇒ 本趟作廢重跑"
  equivalence: |
    【**最強正確性見證，必須先過**】把樹**退化成寬度 1 的樹**（b=1）⇒ 與原鏈式在
    同 seed／同 prompt 下 **token 序列逐位元相同**。不過就停，不往下（同 eng-mh-0082 的教訓：
    先證明「治療真的施加」，否則後面的數字沒有意義）。
targets:
  replay_pct_max: 10.0          # 鏈式 31.7% → 目標
  emit_per_round_min: 1.9       # 鏈式 1.625 / 1.806
  paired_gain_min_pct: 5.0      # k=2 的破線缺口是 +5.4%
  tree_width: 2                 # b=2、深度 1
  tree_depth: 1

subgoals:
  - id: sg-tree-alt-cand
    text:   "`common/speculative.*` 暴露第 1 位的第 2 候選（預設空、關閉時行為逐位元不變）"
    expect: "新增欄位關閉時為空；原鏈式 token 序列不變"
    how:    "`common_speculative_draft_params`（speculative.h:47-79）加預設空的候選欄位；MTP impl（speculative.cpp:1730-1890）在原只取 `cur_p->data[0].id` 處多填第 2 候選（`common_sampler_get_candidates` 已在 :1850 用）"
  - id: sg-tree-batch
    text:   "`llama-bench.cpp` 樹 batch 構建 ＋ 走樹接受（`CGC_SPEC_TREE`，預設關）"
    expect: "開＝走樹；關＝逐位元走原鏈（:3079-3084 與 :3152-3205）"
    how:    "根掛 seq{0,1}；分支 A/B 各自 seq；葉節點 `common_batch_add(..., {s}, true)`；接受後 `llama_memory_seq_rm` 清掉未選中分支。**不動** llama-batch/graph/kv-cache"
  - id: sg-tree-equiv
    text:   "等價性見證：b=1 的樹 ≡ 鏈式（逐位元）"
    expect: "同 seed／同 prompt 的 token 序列完全相同"
    how:    "兩臂同場（`CGC_SPEC_TREE=1` 且寬度 1 vs 關）比對輸出序列"
  - id: sg-tree-mech
    text:   "機制診斷：replay／emit_per_round／hit%／misses ＋ cold-guard 是否被觸發"
    expect: "見 acceptance.success 的機制端點；misses 必須一併報"
    how:    "讀 `CGC-BENCH-ACCEPT`（replay=／emit_per_round=）＋ pool cache 區塊；`CGC-PHASE-DBG` 看 `fast_eligible`"
  - id: sg-tree-ab
    text:   "同 session ABBA（tree / chain / chain / tree）"
    expect: "配對差 ≥ +5%；否則照 falsify 收束"
    how:    "一次 `harness bench` 四臂；絕對 t/s 需乾淨窗才可引用"

# ── 【臂】──
