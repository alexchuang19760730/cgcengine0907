# ── 【前提更正 2026-10-02，實作 T1b 時撞到】──
# 本卡原寫「不動 llama-batch/graph/kv-cache」＝只談 ENGINE 程式碼，這仍成立；
# 但 **CONTEXT 的三個參數前提被漏掉**，而且它們**都要花記憶體**（完整版見
# docs/SPEC_TREE_VERIFY_DESIGN_2026-10-02.md §9）：
#   1. seq id：bench/production 的 context 是 n_seq_max=1 ＋ kv_unified=false ⇒ seq_id=1 **越界**
#      （llama-context.cpp:2593 讓 llama_decode 回 -1）。樹的分支必然要第二個 seq
#      ⇒ 需 kv_unified=true（單一 KV stream，不翻倍）或 n_seq_max=2（KV stream ×2、n_ctx_seq 折半）。
#   2. recurrent 回滾：本模型是 GDN hybrid（LLM_ARCH_QWEN35MOE）⇒ recurrent 半邊不能就地刪後綴
#      （llama-memory-recurrent.cpp:170），需 n_rs_seq>0；RS buffer = mem_size×(1+n_rs_seq)（:99）
#      ⇒ **線性記憶體成本**。llm_arch_supports_rs_rollback() 對該 arch 回 true（llama-arch.cpp:1002）。
#   3. batch seq 槽：llama_batch_init(n,0,1) 每 token 只有 1 個 seq_id 槽，樹根一 token 掛多 seq ⇒ 按寬度放大。
# ⚠ **本軸的真正閘門是記憶體，不是算術**：16 GB 盒子（8 GiB pool＋13.6 GB 模型＋ngl 99）本來就貼著
#   ~15.5/16 GB。2026-10-02 用 n_rs_seq=4 ＋ 8 GiB pool 冒煙 ⇒ 進 swap、UI 被 WindowServer 看門狗判死、
#   llama-bench 自身 Metal status 5 abort（backtrace 在 test_gen ⇒ 樹代碼一次都沒跑到）。
#   ⇒ 之後一律：**4 GiB pool ＋ n_rs_seq = k（=2）＋ 單趟**，先量記憶體再談速度。
#   ⚠ 另：該次事故後 MTLCompilerService 一度不可用（XPC_ERROR_CONNECTION_INVALID），
#     症狀是啟動即 abort（rc=134, <1 s，日誌有 "failed to create library"）——那是**系統殘留**，不是代碼。
