# ── 【技術子目標】可量化、可驗收、貢獻可分 ─────────────────────────────────
subgoals:
  - id: sg-caliber-stat
    text:   "把統計量與判決規則凍結成一支模組（＋selftest，含負控制）"
    expect: "合成 null 無號；精度隨 n_pairs ≈1/√n；L20-10 兩輪（n=3／n=7）判不成立"
    how:    "重用 `rho_abba_verdict` 的 house precision rule 與 `rho_price_authrow --judge` 的兩趟反序讀法"
    delivered: "**已交付（唯讀、未採納）**：`scripts/check/caliber_paired.py --selftest` **31/31 PASS** ——
      合成 null 無號、20% 合成效應可讀、精度 ≈1/√n（n=9 vs n=36，容差 1.5×）；負控制兩輪
      （L20-10 n=7：中位比率 1.0114、方向 5/7、單尾 p=0.227、t=1.23、兩臂散布 11.11%；
      n=3：1.0422）**都判不成立**；統計量與判詞都在，閘門一行未動。"
  - id: sg-caliber-audit
    text:   "唯讀重播已結語料，產出翻轉帳（逐筆可點）"
    expect: "flips=0；A/A 對照全數無號；UNPAIRED 的筆數與處置單獨列帳"
    how:    "讀 preregistered.audit_globs；判詞只寫進本卡的報告，**不改任何既有檔案**"
    delivered: "**已交付（唯讀、未採納）**：同檔的全樹重播 → `Backup/caliber_paired_2026-10-01/audit.{json,md}`
      （2026-10-01 10:15）——掃 2762 檔（讀不出 45，逐筆列帳）、UNPAIRED 1161 單獨列帳、可判配對單元 16；
      **翻轉 0**（門檻 0）、A/A 3 單元 0 號（低於 `min_pairs` 8 ⇒ 尚未認證）、收緊 1
      （舊 QUOTABLE → 新不引用）；兩趟反序讀法附在 rho 那一對上（`rho_AB`／`rho_BA`）。"
  - id: sg-caliber-schedule
    text:   "配對鍵進產物：交錯跑（A,B,A,B,…）＋ 次序欄（AB/BA）＋ cell 宣告 caliber"
    expect: "產物帶 rep 序／臂序／build 指紋；缺鍵 ⇒ 標 UNPAIRED（不得當獨立）"
    how:    "`ab_interleave.py` 既有列鍵 `<arm>#r<rep>`；window runner 接線時沿用它的列鍵"
  - id: sg-caliber-adopt
    text:   "operator 明文採納 ＋ 測試卡宣告；兩支閘門只在 caliber 宣告下切換"
    expect: "前瞻生效日寫進本卡；舊判詞 0 改動；切換是**條件式**（未宣告 caliber 的產物照舊判）"
    how:    "acceptance.success ⑤；切換點：`quote_gate` R2/R3 與 `l2010_verdict` A4"

